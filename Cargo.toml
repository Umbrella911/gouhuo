[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/transport",
    "crates/voice-core",
    "crates/latency-probe",
    "crates/device-probe",
]
# vendor 进来的第三方源码不是工作区成员，只是 [patch] 的目标。
exclude = ["third_party"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
# 核心实现是 copyleft，protocol 单独放宽 —— 见 LICENSING.md。
license = "GPL-3.0-or-later"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
voice-core = { path = "crates/voice-core" }
opus = "0.3"
chacha20poly1305 = "0.10"
windows-sys = "0.59"
sha2 = { version = "0.10", default-features = false }
# 身份用的 Ed25519。zeroize 让私钥在 Drop 时自动擦掉。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
# 控制面消息。protox 是纯 Rust 的 .proto 编译器 —— 不需要贡献者先装 protoc。
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
# TLS。选 ring 而不是 aws-lc-rs：ring 在 Windows/MSVC 上纯 cargo build 就能编，
# aws-lc-rs 要 cmake 和 nasm。见 crates/transport/src/lib.rs 的注释。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.14"
transport = { path = "crates/transport" }
# WASAPI 要走 COM 接口，windows-sys 只有裸 FFI，接不了 IMMDeviceEnumerator/IAudioClient。
windows = "0.62"
# APM（AEC3 / 降噪 / AGC）。bundled 会从源码编 libwebrtc 的 APM 模块。
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }

# M1 只关心延迟数字，所以 release 必须是真 release。
# 注意：不开 panic = "abort"，否则 cargo test --release 跑不了。
# 体积相关的开关（panic=abort / strip）等到打客户端安装包时在 bin 的 profile 里加。
# 上游的 webrtc-audio-processing-sys 在 Windows/MSVC 上编不过（构建脚本里
# 一个 Windows 分支都没有）。third_party/ 下是打过补丁的副本，补丁很小，
# 全部用 `kaimai patch:` 标出来了。诊断见 docs/m2-apm-windows.md。
# 补丁合并到上游之后，删掉这一段和整个 third_party/ 即可。
[patch.crates-io]
webrtc-audio-processing-sys = { path = "third_party/webrtc-audio-processing-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
