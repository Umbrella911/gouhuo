name: redline

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # VS 自带的 cmake 是 4.x，libopus 的 CMakeLists 声明的最低版本太老会被直接拒。
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # MAX_PATH。APM 的 bundled 构建里，abseil 的相对路径 + out 目录能顶到 265 字符
  # （Windows 拿"当前目录 + 相对路径"在规范化**之前**比 260 上限）。
  # 构建根必须短，否则 cl 会报"源文件不存在"——而文件其实在。见 docs/m2-apm-windows.md。
  CARGO_TARGET_DIR: C:\t

jobs:
  # DCO：每个提交都要有 Signed-off-by。
  #
  # 只查 PR 里的提交，不查历史 —— 这个检查是从引入 DCO 那天起生效的，
  # 拿它去追溯以前的提交只会让每个 PR 都红。
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查 Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "缺 Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "提交时加 -s 就会自动带上，补救：git rebase --signoff $base"
            echo "说明见 CONTRIBUTING.md"
            exit 1
          fi
          echo "所有提交都签了。"

  # 确定性的红线：编译、单元测试、带宽和编解码成本。
  # 这些不依赖调度精度，在共享 runner 上也是可信的，所以**门禁在这里**。
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2

      # ---- APM 的构建前置 ----
      # 上游 webrtc-audio-processing-sys 要从源码编 libwebrtc（meson + ninja），
      # 而它的构建脚本没有 Windows 分支。third_party/ 下是打过补丁的副本，
      # 但下面这几样外部工具还是得自己准备。详见 docs/m2-apm-windows.md。
      - name: 装 meson 和 ninja
        run: pip install meson ninja

      - name: 注入 MSVC 环境
        shell: pwsh
        run: |
          # meson 要在 PATH 上看得见 cl.exe 才会选 MSVC 后端。
          # 不用第三方 action，自己从 vcvars 里捞 —— 少一个供应链依赖。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "找不到 vcvars64.bat" }
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -in @('INCLUDE','LIB','LIBPATH','PATH')) {
                if ($name -eq 'PATH') { Add-Content $env:GITHUB_PATH $value.Split(';') }
                else { Add-Content $env:GITHUB_ENV "$name=$value" }
              }
            }
          }

      - name: 定位 libclang（bindgen 要用）
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "libclang.dll") } | Select-Object -First 1
          if (-not $found) { throw "找不到 libclang.dll" }
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$found"

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # third_party/ 是 vendor 进来的第三方代码，不在工作区成员里，本来就不会被扫。
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # 延迟数字。**共享 runner 上不做门禁。**
  #
  # 原因：这测的是实时调度精度。GitHub 托管 runner 是虚拟化的共享机器，
  # 节拍器迟到是常态，测出来的 p95 反映的是 runner 的负载而不是我们的架构。
  # 在那种数字上设门禁只会训练出「重跑一次就绿了」的习惯，比不测更糟。
  #
  # 所以这里只**记录**：跑一遍，把 JSON 存成 artifact，用来看趋势。
  # 真正的门禁要跑在专用机器上 —— 见下面的 gate job。
  latency-record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测量（仅记录，不门禁）
        run: cargo run --release -p latency-probe -- --seconds 4 --json > m1.json
      - name: 人类可读的报告
        run: cargo run --release -p latency-probe -- --seconds 4 > m1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m1-latency-${{ github.sha }}
          path: |
            m1.json
            m1.txt

  # 真门禁。只在专用 Windows 机器上跑 —— 独占、不虚拟化、跑的时候不干别的。
  #
  # 要启用：挂一个带 `dedicated-audio` 标签的 self-hosted runner，
  # 并把仓库变量 DEDICATED_RUNNER 设成 true。
  gate:
    if: vars.DEDICATED_RUNNER == 'true'
    runs-on: [self-hosted, windows, dedicated-audio]
    steps:
      - uses: actions/checkout@v4
      - name: 协议链路的防回归闸
        # 判据：city 档里**存在**一个音质过关、协议延迟在闸以内的配置。
        # 闸的数字来自 redline::GATE_PROTOCOL_MS，不在这里重复写 ——
        # 两处各写一份迟早会漂移，而漂移的那天 CI 是绿的。
        #
        # 只卡协议这一段：设备那段由声卡和驱动决定，APM 那段由 libwebrtc 决定，
        # 这两段变了不是我们改坏了。协议段一旦变慢，一定是我们干的。
        run: cargo run --release -p latency-probe -- --seconds 30 --assert-gate
