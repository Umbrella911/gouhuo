[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "篝火客户端。"

[[bin]]
name = "gouhuo"
path = "src/main.rs"

[dependencies]
client-core.workspace = true
protocol.workspace = true
# 整条语音链路，**带回声消除和降噪**。不需要任何外部工具链 ——
# git clone 完 cargo run 就是完整的。
#
# feature 要显式列：工作区那条关掉了默认值，见根 Cargo.toml 的注释。
voice-core = { workspace = true, features = ["pipeline", "apm"] }
slint = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Time", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build.workspace = true
