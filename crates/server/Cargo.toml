[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# 自部署层：法务白名单友好，但改动要回流，见 LICENSING.md
license = "MPL-2.0"
description = "开麦服务端：单二进制，自部署零依赖。"

# 拆成 lib + bin：集成测试进不了 bin crate，而认证流程恰恰是最需要
# 端到端测的一块。
[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "kaimai-server"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
transport.workspace = true
# 只用它的身份（Ed25519）。**显式关掉默认 feature** —— 服务端从头到尾
# 不碰音频采样，带上 APM 和 Opus 只是白白多编十几个 crate、多占体积。
voice-core = { workspace = true, default-features = false }
rustls.workspace = true
getrandom.workspace = true

[dev-dependencies]
protocol.workspace = true
transport.workspace = true
voice-core = { workspace = true, default-features = false }
rustls.workspace = true
